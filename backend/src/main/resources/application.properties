# 飞书应用配置
feishu.app.id=${FEISHU_APP_ID:your_feishu_app_id}
feishu.app.secret=${FEISHU_APP_SECRET:your_feishu_app_secret}

# 服务器配置
server.port=8080

# 数据库配置
spring.datasource.url=jdbc:mysql://localhost:3306/feishu_integration?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Redis配置
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.password=

# MyBatis配置
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.feishu.integration.entity

# 日志配置
logging.level.com.feishu.integration=INFO
