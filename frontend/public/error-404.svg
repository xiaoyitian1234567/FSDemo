<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <!-- 背景 -->
  <rect width="400" height="300" fill="#f5f7fa" rx="10"/>
  
  <!-- 404文字 -->
  <text x="200" y="120" font-family="Arial, sans-serif" font-size="80" font-weight="bold" text-anchor="middle" fill="#409eff">404</text>
  
  <!-- 错误图标 -->
  <g transform="translate(200, 180)">
    <circle cx="0" cy="0" r="40" fill="#f56c6c"/>
